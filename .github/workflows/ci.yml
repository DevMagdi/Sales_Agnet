name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, types, tests, migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: mypy (strict)
        run: mypy app

      - name: pytest with coverage
        env:
          APP_ENV: test
          OUTREACH_MODE: dry_run
        run: pytest tests/ -q --cov=app --cov-report=term --cov-fail-under=65

      - name: Migrations apply and match the models
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci_check.db
        run: |
          alembic upgrade head
          alembic check

  e2e:
    name: End-to-end journeys + readiness doctor
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"

      - name: Journeys (in-process ASGI, real auth + gate + reply pipeline)
        env:
          APP_ENV: dev
          OUTREACH_MODE: dry_run
          LLM_PROVIDER: fake
          EMAIL_PROVIDER: fake
          SEARCH_PROVIDER: fake
          VERIFY_PROVIDER: local
          CRAWL_ALLOW_LOCAL_HOSTS: "true"
        run: python scripts/e2e_journeys.py

      - name: Readiness doctor (must not crash; exit 0 = ran, not "ready")
        env:
          APP_ENV: dev
          OUTREACH_MODE: dry_run
          LLM_PROVIDER: fake
          EMAIL_PROVIDER: fake
          SEARCH_PROVIDER: fake
          VERIFY_PROVIDER: local
        run: python scripts/doctor.py --json > doctor.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doctor-report
          path: doctor.json
          if-no-files-found: ignore

  frontend:
    name: Dashboard — types, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
