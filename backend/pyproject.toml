[project]
name = "mantiq-outreach-agent"
version = "1.0.0"
description = "Autonomous B2B outbound sales agent for ProcureAI (Mantiq Technologies)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",  # pulls greenlet, required by the async engine
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "alembic>=1.13",
  "httpx>=0.27",
  "tenacity>=8.3",
  "structlog>=24.1",
  "argon2-cffi>=23.1",
  "PyJWT>=2.8",
  "pyotp>=2.9",
  "cryptography>=42",
  "email-validator>=2.1",
  "dnspython>=2.6",
  "tldextract>=5.1",
  "selectolax>=0.3.21",
  "phonenumbers>=8.13",
  "langdetect>=1.0.9",
  "python-multipart>=0.0.9",
  "celery>=5.3",
  "redis>=5.0",
  "PyYAML>=6.0",
  "jinja2>=3.1",
  "rapidfuzz>=3.6",
  "aiosmtplib>=3.0",
  "aioimaplib>=1.1",
  "trafilatura>=1.9",
  "dkimpy>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "aiosmtpd>=1.4.4",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q"
# The tests import `tests.conftest` helpers, so the project root must be importable even when
# pytest is invoked as a bare entry point (CI) rather than `python -m pytest`.
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
branch = false
omit = ["app/workers/*", "app/main.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "C4", "PT"]
ignore = ["B008", "E501", "SIM117", "PT011"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "B011", "PT012", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = [
  "trafilatura.*",
  "selectolax.*",
  "phonenumbers.*",
  "langdetect.*",
  "aioimaplib.*",
  "tldextract.*",
  "dkim.*",
  "celery.*",
  "celery_schedules.*",
]
ignore_missing_imports = true
